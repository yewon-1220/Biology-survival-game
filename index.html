<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designer Baby: 5세대의 선택</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#e8eef5;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
}

.stats{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin:15px 0;
}

.card{
    background:#f4f4f4;
    padding:10px;
    border-radius:10px;
    margin:5px;
    min-width:120px;
    text-align:center;
}

.buttons{
    text-align:center;
    margin-top:20px;
}

button{
    margin:5px;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}

.log{
    margin-top:20px;
    border:1px solid #ddd;
    padding:15px;
    height:280px;
    overflow-y:auto;
    background:#fafafa;
}

.lab{
    text-align:center;
    font-size:40px;
    margin:20px;
}

.news{
    background:#fff3cd;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧬 Designer Baby</h1>

<h3 id="generation">1세대 / 5세대</h3>

<p><b>유전자 안정성:</b> <span id="stability">100</span>%</p>

<div class="lab">
👶<br>
🧬
</div>

<div class="stats">

<div class="card">
🧠<br>
지능<br>
<span id="intelligence">50</span>
</div>

<div class="card">
💪<br>
신체<br>
<span id="strength">50</span>
</div>

<div class="card">
🦠<br>
면역력<br>
<span id="immunity">50</span>
</div>

<div class="card">
✨<br>
외모<br>
<span id="beauty">50</span>
</div>

</div>

<div class="buttons">
<button onclick="editGene('intelligence')">🧠 지능 향상</button>
<button onclick="editGene('strength')">💪 신체 강화</button>
<button onclick="editGene('immunity')">🦠 면역력 강화</button>
<button onclick="editGene('beauty')">✨ 외모 개선</button>
<button onclick="editGene('none')">😊 편집 안 함</button>
</div>

<div class="log" id="log"></div>

</div>

<script>

let generation = 1;

let intelligence = 50;
let strength = 50;
let immunity = 50;
let beauty = 50;

let stability = 100;

const newsEvents = [
"📰 유전자 편집 아동들의 학업 성취도가 증가했다.",
"📰 디자이너 베이비 논란이 확산되고 있다.",
"📰 부유층 중심의 유전자 편집 서비스가 확대되었다.",
"📰 예상치 못한 유전 질환 사례가 보고되었다.",
"📰 인간 능력 향상 기술에 대한 찬반 논쟁이 이어지고 있다."
];

const minorMutations = [
"근시",
"알레르기",
"색각 이상"
];

const moderateMutations = [
"청각 이상",
"성장 장애",
"선천성 심장 결함"
];

const fatalMutations = [
"중증 면역 결핍",
"신경계 발달 이상",
"장기 형성 장애"
];

function log(text){
document.getElementById("log").innerHTML += text + "<br><br>";
document.getElementById("log").scrollTop =
document.getElementById("log").scrollHeight;
}

function updateUI(){

document.getElementById("generation").innerText =
generation + "세대 / 5세대";

document.getElementById("intelligence").innerText = intelligence;
document.getElementById("strength").innerText = strength;
document.getElementById("immunity").innerText = immunity;
document.getElementById("beauty").innerText = beauty;

document.getElementById("stability").innerText =
Math.max(stability,0);
}

function gameOver(reason){

log("💀 GAME OVER");
log(reason);

document.querySelectorAll("button")
.forEach(btn => btn.disabled = true);
}

function victory(){

log("🎉 5세대 생존 성공!");

log("유전자 편집은 많은 이점을 제공했지만, 미래 세대에 미치는 영향은 여전히 불확실합니다.");

document.querySelectorAll("button")
.forEach(btn => btn.disabled = true);
}

function editGene(type){

log("🧬 유전자 편집 진행 중...");

let risk = 0;

if(type==="intelligence"){
intelligence += 15;
risk = 15;
stability -= 10;
log("🧠 지능 향상 선택");
}

else if(type==="strength"){
strength += 15;
risk = 15;
stability -= 10;
log("💪 신체 강화 선택");
}

else if(type==="immunity"){
immunity += 15;
risk = 15;
stability -= 10;
log("🦠 면역력 강화 선택");
}

else if(type==="beauty"){
beauty += 15;
risk = 25;
stability -= 15;
log("✨ 외모 개선 선택");
}

else{
log("😊 유전자 편집을 하지 않았다.");
risk = 5;
}

let mutationChance =
risk + (100 - stability)/2;

let roll = Math.random()*100;

if(roll < mutationChance){

let severity = Math.random()*100;

if(severity < 60){

let mutation =
minorMutations[
Math.floor(Math.random()*minorMutations.length)
];

log("🟡 경미한 돌연변이 발생");
log("결과: " + mutation);
}

else if(severity < 90){

let mutation =
moderateMutations[
Math.floor(Math.random()*moderateMutations.length)
];

log("🟠 중간 수준 돌연변이 발생");
log("결과: " + mutation);

intelligence -= 5;
strength -= 5;
immunity -= 5;
}

else{

let mutation =
fatalMutations[
Math.floor(Math.random()*fatalMutations.length)
];

gameOver("치명적 돌연변이 발생: " + mutation);
return;
}
}

let news =
newsEvents[
Math.floor(Math.random()*newsEvents.length)
];

log(news);

let disease = Math.random()*100;

if(disease > immunity){

gameOver("감염병을 이겨내지 못했다.");
return;
}

log("✅ 다음 세대로 생존");

generation++;

updateUI();

if(generation > 5){
victory();
}
}

updateUI();

log("👨‍🔬 연구소에 오신 것을 환영합니다.");
log("당신은 부모로서 태어날 아이의 유전자를 편집할 수 있습니다.");
log("5세대까지 가문을 생존시키세요.");

</script>

</body>
</html>
